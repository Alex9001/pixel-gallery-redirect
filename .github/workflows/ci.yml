name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified SDK components
        run: python3 setup-sdk.py
      - name: Build, sign, and verify APK
        run: python3 build.py
      - name: Verify permission-free manifest and packaged icon
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, xml.etree.ElementTree as ET, zipfile
          root = ET.parse('AndroidManifest.xml').getroot()
          assert not root.findall('uses-permission'), 'Unexpected permission'
          with zipfile.ZipFile('pixel-gallery-redirect.apk') as apk:
              assert any(p.startswith('res/') and 'ic_launcher' in p for p in apk.namelist())
          tools = pathlib.Path.home() / '.cache/pixel-gallery-android/tools/android-16'
          print(subprocess.check_output([str(tools / 'aapt2'), 'dump', 'permissions', 'pixel-gallery-redirect.apk'], text=True))
          PY
      - name: Set up Android command-line tools for emulator tests
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run selection and routing tests on Android 10
        run: |
          sdkmanager "emulator" "system-images;android-29;default;x86_64"
          echo no | avdmanager create avd --force --name redirect-test --package "system-images;android-29;default;x86_64"
          python3 tests/emulator.py
